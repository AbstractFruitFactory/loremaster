name: Display title fix

on:
  push:
    branches:
      - fix-ingestion-display-titles

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: normalize ingestion document titles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ingestion-display-titles
          fetch-depth: 0
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/apply-display-title-fix.py
      - run: pnpm check
      - run: pnpm exec playwright install chromium
      - run: pnpm test
      - name: Commit implementation
        run: |
          git config user.name "AbstractFruitFactory"
          git config user.email "abstractfruitfactory@pm.me"
          git add src/lib/server/ingestion/index.ts src/lib/server/ingestion/index.spec.ts src/lib/server/ingestion/validation.spec.ts
          git commit -m "fix: normalize ingestion document titles"
          git push
