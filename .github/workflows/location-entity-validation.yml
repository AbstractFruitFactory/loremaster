name: Location entity validation patch

on:
  push:
    branches:
      - fix-location-entity-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-location-entity-validation
          fetch-depth: 0
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/apply-location-entity-validation.py
      - run: pnpm check
      - run: pnpm exec playwright install chromium
      - run: pnpm test
      - name: Commit implementation
        run: |
          rm .github/workflows/location-entity-validation.yml
          rm .github/scripts/apply-location-entity-validation.py
          git config user.name "AbstractFruitFactory"
          git config user.email "abstractfruitfactory@pm.me"
          git add -A
          git commit -m "fix: validate persistent location entities"
          git push origin HEAD:fix-location-entity-validation
