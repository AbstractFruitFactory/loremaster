name: Remove event title fallback

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-event-title-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'unexpected match count in {path}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/server/ingestion/types.ts',
              "\teventTitle?: string | null\n",
              "\teventTitle: string | null\n"
          )
          replace_once(
              'src/lib/server/ai/providers/openai.ts',
              "eventTitle: z.string().trim().min(1).nullable(),",
              "eventTitle: z.string().trim().min(1).max(60).nullable(),"
          )
          replace_once(
              'src/lib/server/ai/providers/openai.ts',
              "eventTitle: { type: ['string', 'null'] },",
              "eventTitle: { type: ['string', 'null'], minLength: 1, maxLength: 60 },"
          )
          replace_once(
              'src/lib/server/ingestion/index.ts',
              "const fallbackEventTitle = (content: string) => {\n\tconst firstLine = content.trim().split(/\\r?\\n/, 1)[0] ?? 'Session event'\n\tconst value = firstLine.replace(/[.!?]+$/u, '').trim()\n\treturn value.length > 60 ? `${value.slice(0, 57).trimEnd()}…` : value || 'Session event'\n}\n\nconst eventTitle = (claim: Pick<ExtractedSessionClaim, 'content' | 'eventTitle'>) => {\n\tconst proposed = claim.eventTitle?.trim().replace(/\\s+/gu, ' ')\n\tif (!proposed) return fallbackEventTitle(claim.content)\n\treturn proposed.length > 60 ? `${proposed.slice(0, 57).trimEnd()}…` : proposed\n}",
              "const eventTitle = ({ eventTitle }: Pick<ExtractedSessionClaim, 'eventTitle'>) => {\n\tif (!eventTitle) throw new Error('Development claim is missing an event title')\n\treturn eventTitle\n}"
          )
          replace_once(
              'src/lib/server/ai/providers/mock.ts',
              "\t\t{\n\t\t\tkind: 'development',\n\t\t\tcertainty: 'explicit',",
              "\t\t{\n\t\t\tkind: 'development',\n\t\t\teventTitle: 'Mock session development',\n\t\t\tcertainty: 'explicit',"
          )
          replace_once(
              'src/lib/server/ingestion/index.spec.ts',
              "\tkind: 'stable-fact',\n\tcertainty: 'explicit',",
              "\tkind: 'stable-fact',\n\teventTitle: null,\n\tcertainty: 'explicit',"
          )

          validation = Path('src/lib/server/ingestion/validation.spec.ts')
          text = validation.read_text()
          old = "\tkind: 'stable-fact',\n\tcertainty: 'explicit',"
          if old not in text:
              raise RuntimeError('validation claims not found')
          validation.write_text(text.replace(old, "\tkind: 'stable-fact',\n\teventTitle: null,\n\tcertainty: 'explicit',"))
          PY

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Install browser
        run: pnpm exec playwright install chromium

      - name: Test
        run: pnpm test

      - name: Commit directly to main
        shell: bash
        run: |
          rm .github/workflows/remove-event-title-fallback.yml
          git config user.name AbstractFruitFactory
          git config user.email abstractfruitfactory@pm.me
          git add -A
          git commit -m 'refactor: require semantic event titles'
          git push origin HEAD:main
