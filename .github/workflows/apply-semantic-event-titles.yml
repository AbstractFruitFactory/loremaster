name: Apply semantic event title patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-semantic-event-titles.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: fix semantic event title workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply semantic event title changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count} for {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/server/ingestion/types.ts',
              "export type ExtractedSessionClaim = {\n\tkind: SessionClaimKind\n\tcertainty: 'explicit' | 'inferred'",
              "export type ExtractedSessionClaim = {\n\tkind: SessionClaimKind\n\teventTitle?: string | null\n\tcertainty: 'explicit' | 'inferred'"
          )

          replace_once(
              'src/lib/server/ai/providers/openai.ts',
              "\t\tz.object({\n\t\t\tkind: z.enum(['stable-fact', 'development', 'mention']),\n\t\t\tcertainty: z.enum(['explicit', 'inferred']),",
              "\t\tz.object({\n\t\t\tkind: z.enum(['stable-fact', 'development', 'mention']),\n\t\t\teventTitle: z.string().trim().min(1).nullable(),\n\t\t\tcertainty: z.enum(['explicit', 'inferred']),"
          )
          replace_once(
              'src/lib/server/ai/providers/openai.ts',
              "\t\t\t\t\t\tkind: { type: 'string', enum: ['stable-fact', 'development', 'mention'] },\n\t\t\t\t\t\tcertainty: { type: 'string', enum: ['explicit', 'inferred'] },",
              "\t\t\t\t\t\tkind: { type: 'string', enum: ['stable-fact', 'development', 'mention'] },\n\t\t\t\t\t\teventTitle: { type: ['string', 'null'] },\n\t\t\t\t\t\tcertainty: { type: 'string', enum: ['explicit', 'inferred'] },"
          )
          replace_once(
              'src/lib/server/ai/providers/openai.ts',
              "required: ['kind', 'certainty', 'content', 'evidence', 'entityReferences']",
              "required: ['kind', 'eventTitle', 'certainty', 'content', 'evidence', 'entityReferences']"
          )
          replace_once(
              'src/lib/server/ai/providers/openai.ts',
              "'Record atomic campaign claims with supporting transcript line ranges and semantic entity references.'",
              "'Record atomic campaign claims with supporting transcript line ranges, semantic entity references, and concise factual titles for developments.'"
          )

          replace_once(
              'src/lib/server/ingestion/index.ts',
              "const eventTitle = (content: string) => {\n\tconst firstLine = content.trim().split(/\\r?\\n/, 1)[0] ?? 'Session event'\n\tconst withoutPunctuation = firstLine.replace(/[.!?]+$/u, '').trim()\n\treturn withoutPunctuation.slice(0, 90) || 'Session event'\n}",
              "const fallbackEventTitle = (content: string) => {\n\tconst firstLine = content.trim().split(/\\r?\\n/, 1)[0] ?? 'Session event'\n\tconst value = firstLine.replace(/[.!?]+$/u, '').trim()\n\treturn value.length > 60 ? `${value.slice(0, 57).trimEnd()}…` : value || 'Session event'\n}\n\nconst eventTitle = (claim: Pick<ExtractedSessionClaim, 'content' | 'eventTitle'>) => {\n\tconst proposed = claim.eventTitle?.trim().replace(/\\s+/gu, ' ')\n\tif (!proposed) return fallbackEventTitle(claim.content)\n\treturn proposed.length > 60 ? `${proposed.slice(0, 57).trimEnd()}…` : proposed\n}"
          )
          replace_once(
              'src/lib/server/ingestion/index.ts',
              "\ttitle: eventTitle(claim.content),",
              "\ttitle: eventTitle(claim),"
          )
          replace_once(
              'src/lib/server/ingestion/index.ts',
              "Mark interpretation as inferred and mere names as mentions. Do not turn a property or topic into an entity: use \"Mara\", not \"Mara\\'s age\".",
              "Mark interpretation as inferred and mere names as mentions. For every development claim, set eventTitle to a concise factual label suitable for a timeline or list: usually 3-8 words and under 60 characters. The title must summarize only the claim content and must not introduce new identity, motive, causality, chronology, or interpretation. Prefer plain labels such as \"Empty Bell cracks\", \"Talven's body discovered\", or \"Saltwater draft in Weaver's Cut\" rather than full sentences or dramatic prose. For stable-fact and mention claims, set eventTitle to null. Do not turn a property or topic into an entity: use \"Mara\", not \"Mara\\'s age\"."
          )
          replace_once(
              'src/lib/server/ingestion/index.ts',
              "\t\t\tclaims.push({\n\t\t\t\tkind: claim.kind,\n\t\t\t\tcontent: claim.content,",
              "\t\t\tclaims.push({\n\t\t\t\tkind: claim.kind,\n\t\t\t\teventTitle: claim.eventTitle,\n\t\t\t\tcontent: claim.content,"
          )

          replace_once(
              'src/lib/server/ingestion/index.spec.ts',
              "\t\t\t\tclaim('Mara hired the party to recover the lockbox.', {\n\t\t\t\t\tkind: 'development',\n\t\t\t\t\tentityReferences: [{ label: 'Mara', type: 'npc' }]",
              "\t\t\t\tclaim('Mara hired the party to recover the lockbox.', {\n\t\t\t\t\tkind: 'development',\n\t\t\t\t\teventTitle: 'Mara hires party for lockbox',\n\t\t\t\t\tentityReferences: [{ label: 'Mara', type: 'npc' }]"
          )
          replace_once(
              'src/lib/server/ingestion/index.spec.ts',
              "\t\t\ttitle: 'Mara hired the party to recover the lockbox',\n\t\t\tselected: true",
              "\t\t\ttitle: 'Mara hires party for lockbox',\n\t\t\tcontent: 'Mara hired the party to recover the lockbox.',\n\t\t\tselected: true"
          )
          PY

      - name: Install dependencies
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Commit directly to main
        shell: bash
        run: |
          rm .github/workflows/apply-semantic-event-titles.yml
          git config user.name 'AbstractFruitFactory'
          git config user.email 'abstractfruitfactory@pm.me'
          git add -A
          git commit -m 'feat: generate semantic event titles'
          git push origin HEAD:main
