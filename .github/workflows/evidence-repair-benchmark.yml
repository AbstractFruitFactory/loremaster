name: Evidence repair benchmark

on:
  push:
    branches:
      - evidence-repair-benchmark
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence-repair-benchmark
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run live evidence repair benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          pnpm exec vite-node --config scripts/vite.config.ts scripts/run-evidence-repair-benchmark.ts | tee evidence-repair-report.log
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-repair-benchmark-report
          path: evidence-repair-report.log
