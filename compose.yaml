services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: loremaster
      POSTGRES_USER: loremaster
      POSTGRES_PASSWORD: loremaster
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loremaster -d loremaster']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
